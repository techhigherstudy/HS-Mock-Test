<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instructions — higher.study</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div id="site-header"></div>
<main class="container"><section class="card instr" id="instr"></section></main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="common.js"></script><script src="data.js"></script><script src="db.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
(function(){
  const {$,esc}=HS,u=HS.api.me(),id=+new URLSearchParams(location.search).get('e');
  if(!u){location.replace('index.html');return}
  const e=HS.api.exam(id);
  if(!e||!HS.db.isPublic(HS.db.get('exams',id))){location.replace('dashboard.html');return}
  const st=HS.api.state(id);
  if(st.kind!=='start'){HS.goExam(id);return}            // resume / limit / coming soon are handled by the exam's own rules
  HS.header([['Home','index.html'],['Mock tests','mocks.html'],[e.title]]);HS.footer();
  HS.track('instructions_viewed',{exam:e.title});
  const p=HS.db.buildPaper(HS.db.get('exams',id)),maxM=HS.db.maxMarks(HS.db.get('exams',id)),qs=p.qids.map(x=>HS.db.get('questions',x));
  const negs=[...new Set(qs.map(q=>q.neg))].sort((a,b)=>a-b),fmt=n=>(Math.round(n*100)/100).toString();
  const sectional=p.secs.length>0&&e.sectionTimers&&p.secs.every(s=>s.minutes>0);
  const rows=(p.secs.length?p.secs:[{id:0,name:'All questions',minutes:0}]).map(s=>{const sq=qs.filter(q=>q.sectionId===s.id||!p.secs.length);const ms=sq.reduce((n,q)=>n+q.marks,0);
    const meta=(e.sections||[]).find(x=>x.id===s.id)||{};return `<tr><td><b>${esc(s.name)}</b>${meta.description?` — ${esc(meta.description)}`:''}</td><td>${sq.length}</td><td>${sectional?s.minutes+' min':'Shared timer'}</td><td>${fmt(ms)}</td></tr>`}).join('');
  const attemptTxt=e.attemptLimit>0?`${st.used||0} of ${e.attemptLimit} attempts used`:'Unlimited attempts';
  $('#instr').innerHTML=`
    <h1>${esc(e.title)}</h1><p class="sub">Hi ${esc(u.name.split(' ')[0])}, please read the instructions carefully before you begin.</p>
    <div class="pills"><span class="pill">${e.duration} minutes</span><span class="pill">${qs.length} questions</span><span class="pill">${fmt(maxM)} marks</span><span class="pill">${negs.some(n=>n<0)?'Negative marking':'No negative marking'}</span><span class="pill">${attemptTxt}</span></div>
    <table class="sec-table"><thead><tr><th>${p.secs.length?'Section':'Paper'}</th><th>Questions</th><th>Time</th><th>Marks</th></tr></thead><tbody>${rows}</tbody></table>
    <h3 style="margin:22px 0 0">Instructions</h3>
    <ol>${(e.instructions||[]).map(i=>`<li>${esc(i)}</li>`).join('')||'<li>Read each question carefully and answer within the time limit.</li>'}
      <li>${e.allowResume?'If you leave the test, your answers are saved and you can resume from your dashboard until the timer ends.':'This test cannot be resumed. If you leave, your saved answers are submitted.'}</li>
      ${e.showSolutions==='never'?'':'<li>Solutions are shown on your result page after you submit.</li>'}</ol>
    <label class="ack"><input type="checkbox" id="ack"><span>I have read and understood all examination instructions.</span></label>
    <button class="btn btn-primary btn-lg" id="go" disabled>Start Test</button>`;
  $('#ack').onchange=()=>$('#go').disabled=!$('#ack').checked;
  $('#go').onclick=()=>{const go=$('#go');go.disabled=true;go.textContent='Starting…';const r=HS.api.start(id);
    if(!r.ok){HS.toast('This test cannot be started right now.','warn');setTimeout(()=>HS.goExam(id),600);return}location.href='exam.html?a='+encodeURIComponent(r.attempt.id)};
})();
</script></body></html>
