<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Result — higher.study</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div id="site-header"></div>
<main class="container" id="res"></main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="common.js"></script><script src="data.js"></script><script src="db.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="learn.js"></script>
<script>
(function(){
  const {$,esc}=HS,u=HS.api.me();
  if(!u){location.replace('index.html');return}
  const at=HS.api.attemptById(new URLSearchParams(location.search).get('a'));
  HS.header([['Home','index.html'],['My dashboard','dashboard.html'],['Result']]);HS.footer();
  if(!at||at.status!=='submitted'){
    if(at&&at.status==='in_progress'){location.replace('exam.html?a='+encodeURIComponent(at.id));return}
    $('#res').innerHTML=`<div class="card empty" style="margin-top:32px"><h2>Result not found</h2><p>We could not find this attempt on your account.</p><a class="btn btn-primary" href="dashboard.html">Go to dashboard</a></div>`;return}
  const daily=at.kind==='daily',e=daily?{title:at.title}:(HS.db.get('exams',at.examId)||{title:'Test'}),r=at.result,rv=HS.api.review(at),mm=s=>`${Math.floor(s/60)}m ${s%60}s`,L='ABCDEF';
  document.title='Result — '+e.title;HS.track('result_viewed',{exam:e.title});HS.act('result_viewed',{examId:at.examId,tool:daily?'daily-quiz':'mock-test'});
  const st=HS.api.state(at.examId),again=!daily&&st.kind==='start'&&at.examId;
  const verdict=r.passed===true?'<span class="chip g">Passed</span>':r.passed===false?'<span class="chip r">Not passed</span>':'';
  const fmtAns=(q,a)=>{if(!HS.api.isAnswered(a))return 'Not attempted';
    if(q.type==='MSQ')return a.map(i=>`${L[i]}. ${q.options[i]}`).join(', ');
    if(q.type==='NUM'||q.type==='TEXT')return String(a);return `${L[a]}. ${q.options[a]}`};
  const fmtOk=q=>q.type==='MSQ'?q.correct.map(i=>`${L[i]}. ${q.options[i]}`).join(', '):(q.type==='NUM'||q.type==='TEXT')?String(q.correct):`${L[q.correct]}. ${q.options[q.correct]}`;
  const sol=rv&&rv.showSolutions?`<h2 class="plain" style="margin-top:30px">Solutions</h2>`+rv.questions.map((q,i)=>{
      const d=rv.detail[q.id]||{status:'skipped'},a=at.answers[q.id],cls=d.status==='correct'?'ok':d.status==='wrong'?'bad':'sk';
      return `<div class="card rev"><h4>${esc(HS.db.secName(q.examId,q.sectionId)==='—'?'Question':HS.db.secName(q.examId,q.sectionId))} · Q${i+1}</h4>${q.passage?`<div style="font-size:14px;color:var(--muted);margin-bottom:8px">${q.passage}</div>`:''}<div>${esc(q.q)}</div>
       <p style="margin:8px 0 0"><span class="${cls}">${d.status==='correct'?'Correct':d.status==='wrong'?'Incorrect':'Skipped'}</span> · Your answer: ${esc(fmtAns(q,a))}${d.status==='correct'?'':` · Correct answer: <b>${esc(fmtOk(q))}</b>`} · Marks: ${d.marks||0}</p>
       ${q.expl?`<div class="sol"><b>Solution:</b> ${esc(q.expl)}</div>`:''}</div>`}).join(''):
    `<div class="card empty" style="margin-top:24px">The answer key for this test is not shown to students.</div>`;
  $('#res').innerHTML=`
   <section class="res-hero"><div><h1>${esc(e.title)}</h1><p>${esc(u.name)} · submitted ${new Date(at.submittedAt).toLocaleString()}${at.auto?' · auto-submitted':''}</p><p style="margin-top:8px">${verdict}${e.passMarks?` <span style="opacity:.9">Pass marks: ${e.passMarks}</span>`:''}</p></div>
     <div class="score"><b>${r.marks}</b><span> / ${r.max}</span><p>${r.percentage}%</p></div></section>
   <div class="res-actions"><a class="btn btn-primary" href="dashboard.html">Back to dashboard</a><a class="btn btn-ghost" href="index.html">Home</a>${daily?'<a class="btn btn-ghost" href="daily.html">Daily Quiz &amp; leaderboard</a><a class="btn btn-ghost" href="performance.html">My performance</a>':'<a class="btn btn-ghost" href="mocks.html">More mock tests</a><a class="btn btn-ghost" href="performance.html">My performance</a>'}${again?`<button class="btn btn-ghost" id="again">Attempt again</button>`:''}</div>
   <section class="kpis">${[['Questions',r.total],['Attempted',r.attempted],['Correct',r.correct],['Incorrect',r.wrong],['Accuracy',r.accuracy+'%'],['Time taken',mm(r.timeTakenSec)]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</section>
   <h2 class="plain" style="margin-top:28px">${r.sections.length>1?'Section-wise performance':'Performance'}</h2>
   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Section</th><th>Attempted</th><th>Correct</th><th>Incorrect</th><th>Score</th><th>Max</th></tr></thead><tbody>
   ${r.sections.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.attempted}/${s.total}</td><td>${s.correct}</td><td>${s.wrong}</td><td><b>${s.marks}</b></td><td>${s.max}</td></tr>`).join('')}</tbody></table></div>
   ${sol}
   <section class="cta" style="margin-top:28px"><div><h3>Want to improve your score?</h3><p>Check which colleges fit your score, or talk to a counsellor.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-lg" href="predictor.html?e=${at.examId}&p=${Math.round(r.percentage)}">College predictor</a><a class="btn btn-lg" id="cta" target="_blank" rel="noopener">Get free counselling</a></div></section>`;
  $('#cta').href=HS.counsellingUrl();$('#cta').addEventListener('click',()=>HS.track('counselling_button_clicked'));
  const ag=$('#again');if(ag)ag.onclick=()=>HS.goExam(at.examId);
})();
</script></body></html>
