<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Tests — higher.study</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div id="site-header"></div>
<main class="container">
  <section class="hero"><h1>Free <em>mock tests</em></h1><p>Pick an examination, attempt a full-length or sectional mock and get your score instantly.</p></section>
  <div class="lib-bar">
    <input class="fi" id="q" type="search" placeholder="Search tests" aria-label="Search tests">
    <select class="fi" id="cat" aria-label="Examination"></select>
    <select class="fi" id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="az">Name A–Z</option><option value="dur">Shortest first</option></select>
    <button class="btn btn-ghost" id="clear">Clear filters</button>
  </div>
  <div id="count" class="lib-count"></div>
  <div class="tests" id="tests"></div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="common.js"></script><script src="data.js"></script><script src="db.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="tests.js"></script>
<script>
(function(){const {$,esc}=HS;HS.header([['Home','index.html'],['Free Resources'],['Mock Tests']]);HS.footer();HS.track('website_visited');
let exams=[];
const cats=HS.db.all('cats').filter(c=>c.active);
$('#cat').innerHTML='<option value="">All examinations</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
function render(){const q=$('#q').value.trim().toLowerCase(),c=$('#cat').value,s=$('#sort').value;
  let l=exams.filter(e=>(!c||e.categoryId==c)&&(!q||(e.title+' '+e.description+' '+e.category).toLowerCase().includes(q)));
  l.sort((a,b)=>s==='az'?a.title.localeCompare(b.title):s==='dur'?a.duration-b.duration:new Date(b.createdAt)-new Date(a.createdAt)||b.id-a.id);
  $('#count').textContent=`${l.length} test${l.length===1?'':'s'}`;
  $('#tests').innerHTML=l.length?l.map(HS.examCard).join(''):'<div class="card empty" style="grid-column:1/-1">No tests match your search. Try clearing the filters.</div>'}
HS.api.exams().then(e=>{exams=e;render()});
['q','cat','sort'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#clear').onclick=()=>{$('#q').value='';$('#cat').value='';$('#sort').value='new';render()};
HS.bindStart($('#tests'));})();
</script></body></html>
