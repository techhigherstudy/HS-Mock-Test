<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test — higher.study</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head><body class="exam">
<div id="app"><div class="loading">Loading test…</div></div>
<div class="overlay ex-overlay" id="m-section"><div class="sm-modal modal"><button class="x" data-close>×</button><h3>Leave this section?</h3><p id="m-section-txt"></p><div class="sm-actions"><button class="btn btn-ghost" data-close>Stay in this section</button><button class="btn btn-primary" id="m-section-go">Yes, move on</button></div></div></div>

<div class="overlay ex-overlay" id="m-exit"><div class="sm-modal modal"><button class="x" data-close>×</button><h3>Leave the examination?</h3><p id="m-exit-txt"></p><div class="sm-actions"><button class="btn btn-ghost" data-close>Stay in the test</button><button class="btn btn-primary" id="m-exit-go">Leave test</button></div></div></div>
<script src="config.js"></script><script src="common.js"></script><script src="data.js"></script><script src="db.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="exam.js"></script>
